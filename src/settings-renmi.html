<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:; media-src 'self' file:">
  <title>Renmi Settings</title>
  <link rel="stylesheet" href="settings.css">
  <style>
    .renmi-settings-note { color: var(--muted, #888); line-height: 1.5; margin: 8px 0 20px; }
    .renmi-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .renmi-theme-card { border: 1px solid var(--border, #ddd); border-radius: 14px; padding: 12px; cursor: pointer; background: var(--card, transparent); }
    .renmi-theme-card.active { border-color: var(--accent, #8b7cff); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #8b7cff) 25%, transparent); }
    .renmi-theme-card img { width: 100%; height: 130px; object-fit: contain; display: block; image-rendering: pixelated; }
    .renmi-theme-card-name { font-weight: 650; margin-top: 8px; }
    .renmi-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border, #ddd); }
    .renmi-row:last-child { border-bottom: 0; }
    .renmi-row label { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .renmi-row small { color: var(--muted, #888); }
    .renmi-row input[type=range] { width: 200px; }
    .renmi-row select, .renmi-row input[type=text] { min-width: 180px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border, #bbb); background: inherit; color: inherit; }
    .renmi-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .renmi-button { padding: 9px 14px; border: 1px solid var(--border, #bbb); border-radius: 9px; background: transparent; color: inherit; cursor: pointer; }
    .renmi-button.primary { background: var(--accent, #8b7cff); color: white; border-color: transparent; }
    .renmi-pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: var(--border, #ddd); font-size: 12px; }
    .renmi-slider-list { display: grid; gap: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
  <div id="toastStack" class="toast-stack"></div>
  <script src="settings-renmi.js"></script>
</body>
</html>
