<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self'; img-src 'self' file: data:; media-src 'self';">
  <link rel="stylesheet" href="skin-stage.css">
  <link rel="stylesheet" href="character-select.css">
  <title>Choose your companion</title>
</head>
<body>
  <div class="cs-app">
    <header class="cs-header">
      <h1 class="cs-title" id="cs-title">Choose your companion</h1>
    </header>

    <main class="cs-main">
      <section class="cs-preview-col">
        <div class="cs-preview-area">
          <div id="cs-preview-root" class="skin-stage-root"></div>
          <div class="cs-empty" id="cs-empty" hidden>No companions found yet.</div>
        </div>
        <div class="cs-state-tabs" id="cs-state-tabs"></div>
      </section>

      <section class="cs-config-col">
        <div class="cs-panel">
          <div class="cs-skin-cards" id="cs-skin-cards"></div>
        </div>

        <div class="cs-panel" id="cs-color-panel">
          <label class="cs-label" id="cs-color-label">Body color</label>
          <div class="cs-color-row">
            <input type="color" id="cs-color-input" value="#ffffff">
            <div class="cs-color-presets" id="cs-color-presets"></div>
          </div>
        </div>

        <div class="cs-panel">
          <label class="cs-label" id="cs-size-label">Size</label>
          <div class="cs-size-row">
            <input type="range" id="cs-size-input" min="0.5" max="2" step="0.1" value="1">
            <span class="cs-size-value" id="cs-size-value">1.0×</span>
          </div>
        </div>

        <div class="cs-panel" id="cs-patterns-panel">
          <label class="cs-label" id="cs-patterns-label">Patterns</label>
          <div class="cs-check-list" id="cs-patterns-list"></div>
        </div>

        <div class="cs-panel" id="cs-accessories-panel">
          <label class="cs-label" id="cs-accessories-label">Accessories</label>
          <div class="cs-check-list" id="cs-accessories-list"></div>
        </div>
      </section>
    </main>

    <footer class="cs-footer">
      <button id="cs-cancel" class="cs-btn cs-btn-ghost" type="button">Cancel</button>
      <button id="cs-confirm" class="cs-btn cs-btn-primary" type="button">Confirm</button>
    </footer>
  </div>

  <script src="skin-fill.js"></script>
  <script src="skin-stage.js"></script>
  <script src="character-select-renderer.js"></script>
</body>
</html>
