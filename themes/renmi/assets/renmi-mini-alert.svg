<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <style><![CDATA[
      .mini-motion { transform-box: fill-box; transform-origin: center; animation: mini-alert 0.9s infinite ease-in-out; }
      @keyframes mini-alert {
        0%, 100% { transform: translateY(0) rotate(0deg) scale(1, 1); }
        20% { transform: translateY(-12px) rotate(-4deg) scale(1.02, 0.98); }
        42% { transform: translateY(0) rotate(4deg) scale(1, 1); }
        64% { transform: translateY(-8px) rotate(-2deg) scale(1.01, 0.99); }
      }
    ]]></style>
    <filter id="default-white-pixels" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0" />
      <feComponentTransfer><feFuncR type="linear" slope="20" intercept="-19" /><feFuncG type="linear" slope="20" intercept="-19" /><feFuncB type="linear" slope="20" intercept="-19" /></feComponentTransfer>
    </filter>
    <mask id="default-white-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254" mask-type="luminance">
      <image href="renmi.png" x="0" y="0" width="1254" height="1254" filter="url(#default-white-pixels)" />
    </mask>
  </defs>
  <g transform="translate(175.56 175.56) scale(0.72)"><g class="mini-motion"><image href="renmi.png" x="0" y="0" width="1254" height="1254" /><rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" mask="url(#default-white-mask)" /></g></g>
  <script type="application/ecmascript"><![CDATA[
    (() => { const fills = Array.from(document.querySelectorAll(".renmi-tint-fill")); const colorPattern = /^#[0-9a-f]{6}$/i; window.__clawdSetPetTint = (color) => { const next = typeof color === "string" && colorPattern.test(color) ? color : "transparent"; for (const fill of fills) fill.setAttribute("fill", next); }; })();
  ]]></script>
</svg>
