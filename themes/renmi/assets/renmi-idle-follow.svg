<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <style>
      #head-js { transition: transform 0.18s ease-out; }
      #eyes-js { transition: transform 0.16s ease-out; }
      .eyes-blink {
        transform-box: fill-box;
        transform-origin: center;
        animation: eye-blink 4.8s infinite ease-in-out;
      }
      @keyframes eye-blink {
        0%, 86%, 100% { transform: scaleY(1); }
        89% { transform: scaleY(0.08); }
        92% { transform: scaleY(1); }
      }
    </style>

    <!-- This mask is based on the authored default artwork, not on the
         current tint. Only its near-white regions are recolored; the brown
         outline, pink details, eyes and beige shading stay untouched. -->
    <filter id="default-white-pixels" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        .2126 .7152 .0722 0 0
        .2126 .7152 .0722 0 0
        .2126 .7152 .0722 0 0
        0 0 0 1 0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="20" intercept="-19" />
        <feFuncG type="linear" slope="20" intercept="-19" />
        <feFuncB type="linear" slope="20" intercept="-19" />
      </feComponentTransfer>
    </filter>

    <mask id="default-white-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254" mask-type="luminance">
      <image href="renmi.png" x="0" y="0" width="1254" height="1254" filter="url(#default-white-pixels)" />
    </mask>

    <!-- Keep the authored tail stationary behind the torso. This is the
         complete tail silhouette, so there is no split, moving layer, or
         duplicated tail edge left behind. -->
    <clipPath id="tail-static-clip" clipPathUnits="userSpaceOnUse">
      <path d="M 940 828
        C 1000 808 1063 829 1098 875
        C 1130 918 1138 981 1125 1038
        C 1112 1090 1081 1140 1039 1172
        C 997 1204 945 1222 891 1222
        C 845 1221 806 1209 779 1184
        C 755 1162 744 1131 751 1095
        C 759 1053 790 1029 832 1016
        C 874 1004 922 999 944 979
        C 970 956 974 928 970 900
        C 967 870 957 843 940 828 Z" />
    </clipPath>

    <!-- The body/paws are composited in front of the tail at every frame. -->
    <clipPath id="torso-front-clip" clipPathUnits="userSpaceOnUse">
      <path d="M 180 588
        C 330 650 700 666 930 600
        C 945 680 956 760 960 825
        C 968 880 974 938 968 988
        C 962 1018 938 1031 900 1038
        C 858 1046 820 1066 797 1096
        C 778 1121 772 1150 781 1168
        C 764 1187 742 1202 720 1212
        L 720 1254 L 180 1254 Z" />
    </clipPath>

    <clipPath id="head-overlap-clip" clipPathUnits="userSpaceOnUse">
      <!-- Keep the moving head above the curved neck seam. The lower edge is
           deliberately mirrored around the face center: an asymmetric crop
           can expose a gap on one side when the head rotates. -->
      <path d="M 174 0 H 1080 V 550
        C 989 593 942 618 869 641
        C 790 666 708 680 627 681
        C 546 682 464 673 385 649
        C 312 628 265 603 174 560 Z" />
    </clipPath>

    <clipPath id="head-left-lower-static-clip" clipPathUnits="userSpaceOnUse">
      <!-- This lower-left strip stays in the original orientation and
           overlaps the moving head by a small, rounded band. Only the upper
           head layer is rotated, so the left seam cannot open into a gap. -->
      <path d="M 174 532
        C 265 575 312 600 385 621
        C 464 645 546 654 627 653
        L 627 760
        C 540 760 450 750 365 725
        C 280 700 220 660 174 610 Z" />
    </clipPath>

    <clipPath id="head-right-lower-static-clip" clipPathUnits="userSpaceOnUse">
      <!-- Mirror the fixed lower strip on the right so both head seams use
           the same two-layer construction. -->
      <path d="M 1080 532
        C 989 575 942 600 869 621
        C 790 645 708 654 627 653
        L 627 760
        C 714 760 804 750 889 725
        C 974 700 1034 660 1080 610 Z" />
    </clipPath>

    <clipPath id="neck-front-clip" clipPathUnits="userSpaceOnUse">
      <path d="M 196 560
        C 275 596 317 618 390 641
        C 471 666 551 680 627 681
        C 708 680 790 666 869 641
        C 942 618 989 593 1058 550
        C 1045 615 1010 671 955 713
        C 867 780 752 802 627 802
        C 500 802 382 780 294 713
        C 242 673 208 617 196 560 Z" />
    </clipPath>
  </defs>

  <!-- Draw the complete stationary tail first, then place the torso and paws
       in front of its root so the original overlap stays natural. -->
  <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#tail-static-clip)" />
  <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#tail-static-clip)" mask="url(#default-white-mask)" />

  <!-- Stationary body and paws. -->
  <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#torso-front-clip)" />
  <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#torso-front-clip)" mask="url(#default-white-mask)" />

  <!-- Stationary lower layer. Its upper edge overlaps the moving head so the
       head can cover it wherever the two layers meet. -->
  <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#head-left-lower-static-clip)" />
  <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#head-left-lower-static-clip)" mask="url(#default-white-mask)" />
  <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#head-right-lower-static-clip)" />
  <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#head-right-lower-static-clip)" mask="url(#default-white-mask)" />
  <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#neck-front-clip)" />
  <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#neck-front-clip)" mask="url(#default-white-mask)" />

  <!-- Head, eyes and blink are the upper layer. The head keeps only its
       local overlap clip so the ears and crown remain intact while it tilts. -->
  <g id="head-js">
    <image href="renmi.png" x="0" y="0" width="1254" height="1254" clip-path="url(#head-overlap-clip)" />
    <rect class="renmi-tint-fill" x="0" y="0" width="1254" height="1254" fill="transparent" clip-path="url(#head-overlap-clip)" mask="url(#default-white-mask)" />
    <g fill="#ffffff">
      <ellipse cx="477" cy="421" rx="52" ry="48" />
      <ellipse cx="698" cy="421" rx="52" ry="48" />
    </g>
    <g id="eyes-js">
      <g class="eyes-blink">
        <g fill="#5a3a2f">
          <ellipse cx="477" cy="421" rx="31" ry="33" />
          <ellipse cx="698" cy="421" rx="31" ry="33" />
        </g>
        <g fill="#ffffff" opacity="0.82">
          <ellipse cx="467" cy="410" rx="7" ry="8" />
          <ellipse cx="688" cy="410" rx="7" ry="8" />
        </g>
      </g>
    </g>
  </g>

  <!-- Keep the tint bridge local to this scripted SVG. Eye tracking and head
       tilt are controlled by the renderer through the ids above. -->
  <script type="application/ecmascript"><![CDATA[
    (() => {
      const tintFills = Array.from(document.querySelectorAll(".renmi-tint-fill"));
      const tintColorPattern = /^#[0-9a-f]{6}$/i;
      window.__clawdSetPetTint = (color) => {
        const next = typeof color === "string" && tintColorPattern.test(color)
          ? color
          : "transparent";
        for (const fill of tintFills) fill.setAttribute("fill", next);
      };

    })();
  ]]></script>
</svg>
